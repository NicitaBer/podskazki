<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Свидетель | Математические Игры 117</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #1a1a2e 0%, #0f0f1a 100%);
            font-family: 'Courier New', monospace;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" opacity="0.05"><path fill="none" stroke="%23d4af37" stroke-width="0.5" d="M20 20 L180 20 M20 40 L180 40 M20 60 L180 60 M20 80 L180 80 M20 100 L180 100 M20 120 L180 120 M20 140 L180 140 M20 160 L180 160 M20 180 L180 180 M40 20 L40 180 M60 20 L60 180 M80 20 L80 180 M100 20 L100 180 M120 20 L120 180 M140 20 L140 180 M160 20 L160 180"/><circle cx="100" cy="100" r="15" stroke="%23d4af37" stroke-width="0.5" fill="none"/><path d="M100 85 L100 115 M85 100 L115 100" stroke="%23d4af37" stroke-width="0.5"/></svg>');
            background-repeat: repeat;
            pointer-events: none;
        }

        .top-buttons {
            position: fixed;
            top: 16px;
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            z-index: 1000;
            pointer-events: none;
        }
        .home-btn, .fullscreen-btn {
            pointer-events: auto;
            background: #2c2418cc;
            backdrop-filter: blur(8px);
            border: 1px solid #c7a25b;
            color: #eedbba;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            font-weight: bold;
            padding: 6px 14px;
            border-radius: 40px;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .home-btn:active, .fullscreen-btn:active { background: #4a3a2a; transform: scale(0.96); }

        .container {
            background: #2c2418;
            background-image: radial-gradient(circle at 25% 40%, rgba(80,70,50,0.3) 2%, transparent 2.5%);
            background-size: 24px 24px;
            border-radius: 32px;
            box-shadow: 0 25px 35px rgba(0,0,0,0.5);
            border: 1px solid #b89a6b;
            padding: 30px 20px 35px;
            max-width: 750px;
            width: 100%;
            text-align: center;
            margin: 60px 0 20px;
        }

        .crime-header {
            border-bottom: 2px solid #c7a25b;
            padding-bottom: 18px;
            margin-bottom: 28px;
        }
        .crime-header h1 {
            font-family: 'Courier New', monospace;
            font-weight: 700;
            font-size: 1.7rem;
            letter-spacing: 2px;
            color: #ecd9b4;
            text-shadow: 3px 3px 0 #2a2418;
        }
        .sub {
            color: #dbbc87;
            font-size: 0.7rem;
            font-weight: bold;
            letter-spacing: 1.5px;
            margin-top: 8px;
            background: #1f1b1480;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 40px;
        }

        .group-header {
            font-size: 1.8rem;
            font-weight: bold;
            color: #f3e3b0;
            text-shadow: 4px 4px 0 #2a2418;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin: 30px auto 20px;
            max-width: 600px;
            justify-items: center;
        }
        .grid .btn:nth-child(10) {
            grid-column: 2 / 3;
        }
        .btn {
            background: #221f1a;
            background-image: linear-gradient(145deg, #2b241c, #19150f);
            border: 1px solid #c7a25b;
            border-radius: 40px;
            padding: 14px 10px;
            cursor: pointer;
            box-shadow: 0 6px 0 #0c0a07;
            transition: 0.1s;
            color: #eedbba;
            font-weight: bold;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
            text-align: center;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #0c0a07; }
        .btn:hover {
            background: #3a2f1a;
            border-color: #d4af37;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 6px 0 #0c0a07;
        }

        .back-btn {
            background: #4a3a2a;
            border: 1px solid #b89a6b;
            border-radius: 40px;
            padding: 10px 28px;
            cursor: pointer;
            box-shadow: 0 4px 0 #1f1b14;
            transition: 0.1s;
            color: #f3e3c2;
            font-weight: bold;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            display: inline-block;
            margin-top: 10px;
        }
        .back-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #1f1b14; }

        .footer {
            color: #7f6b48;
            font-size: 0.65rem;
            border-top: 1px dashed #5f4e32;
            padding-top: 18px;
            margin-top: 20px;
        }

        .hint-display {
            background: #1f1b14;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 20px;
            margin: 15px 0;
            color: #f5e6b0;
            font-size: 1.1rem;
            font-weight: bold;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            word-break: break-word;
        }
        .hint-display.empty {
            color: #5f4e32;
            font-size: 0.9rem;
            font-weight: normal;
        }

        .hint-actions {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin: 10px 0;
        }
        .hint-btn-action {
            background: #221f1a;
            background-image: linear-gradient(145deg, #2b241c, #19150f);
            border: 1px solid #c7a25b;
            border-radius: 40px;
            padding: 10px 24px;
            cursor: pointer;
            box-shadow: 0 5px 0 #0c0a07;
            transition: 0.1s;
            color: #eedbba;
            font-weight: bold;
            font-size: 0.9rem;
            font-family: 'Courier New', monospace;
        }
        .hint-btn-action:active { transform: translateY(3px); box-shadow: 0 2px 0 #0c0a07; }
        .hint-btn-action:hover {
            background: #3a2f1a;
            border-color: #d4af37;
            color: #f5e6b0;
        }
        .hint-btn-action:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 5px 0 #0c0a07;
        }
        .hint-btn-action.delete {
            border-color: #8b3a3a;
            color: #e8a0a0;
        }
        .hint-btn-action.delete:hover {
            background: #4a2a2a;
            border-color: #e88060;
        }
        .hint-btn-action.delete:disabled {
            opacity: 0.3;
        }

        .hidden {
            display: none !important;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            justify-content: center;
            align-items: center;
            z-index: 9999;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-box {
            background: #2c2418;
            border: 2px solid #d4af37;
            border-radius: 32px;
            padding: 35px 30px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 60px rgba(212, 175, 55, 0.15);
            animation: modalFade 0.3s ease;
        }
        @keyframes modalFade {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-box .modal-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        .modal-box .modal-title {
            color: #f5e6b0;
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .modal-box .modal-message {
            color: #dbbc87;
            font-size: 0.95rem;
            font-weight: 600;
            line-height: 1.5;
        }
        .modal-box .modal-btn {
            margin-top: 18px;
            background: #221f1a;
            background-image: linear-gradient(145deg, #2b241c, #19150f);
            border: 1px solid #c7a25b;
            border-radius: 40px;
            padding: 10px 35px;
            cursor: pointer;
            box-shadow: 0 6px 0 #0c0a07;
            transition: 0.1s;
            color: #eedbba;
            font-weight: 700;
            font-size: 1rem;
            font-family: 'Courier New', monospace;
            display: inline-block;
            width: auto;
            min-width: 140px;
        }
        .modal-box .modal-btn:active {
            transform: translateY(3px);
            box-shadow: 0 3px 0 #0c0a07;
        }
        .modal-box .modal-btn:hover {
            background: #3a2f1a;
            border-color: #d4af37;
            color: #f5e6b0;
        }
        .modal-box.loading {
            border-color: #f3d06b;
        }
        .modal-box.loading .modal-icon {
            animation: spin 1.2s linear infinite;
        }
        .modal-box.loading .modal-btn {
            display: none;
        }
        .modal-box.error {
            border-color: #e88060;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 550px) {
            .grid { grid-template-columns: repeat(2, 1fr); max-width: 400px; gap: 10px; }
            .grid .btn:nth-child(10) { grid-column: auto; }
            .btn { font-size: 0.8rem; padding: 12px 8px; min-height: 50px; }
            .container { padding: 16px; }
            .hint-display { font-size: 0.95rem; padding: 14px; min-height: 60px; }
            .hint-btn-action { font-size: 0.8rem; padding: 8px 16px; }
            .modal-box .modal-btn { min-width: 120px; padding: 8px 28px; }
        }
        @media (max-width: 400px) {
            .grid { grid-template-columns: repeat(2, 1fr); gap: 8px; max-width: 300px; }
            .grid .btn:nth-child(10) { grid-column: auto; }
            .btn { font-size: 0.7rem; padding: 10px 6px; min-height: 44px; }
            .hint-display { font-size: 0.8rem; padding: 10px; min-height: 50px; }
        }
    </style>
</head>
<body>

    <div class="top-buttons">
        <button class="home-btn" id="homeButton">🏠 ДОМОЙ</button>
        <button class="fullscreen-btn" id="fullscreenBtn">⛶ ВО ВЕСЬ ЭКРАН</button>
    </div>

    <div class="container">

        <!-- ===== ГЛАВНАЯ СТРАНИЦА (СПИСОК ЗОН) ===== -->
        <div id="mainPage">
            <div class="crime-header">
                <h1>👁️ СВИДЕТЕЛЬ</h1>
                <div class="sub">ВЫБЕРИТЕ ЗОНУ</div>
            </div>
            <div class="grid" id="zoneGrid"></div>
            <div class="footer">ПОДСКАЗКИ ДЛЯ КОМАНД</div>
        </div>

        <!-- ===== СТРАНИЦА ЗОНЫ (ПОДСКАЗКИ) ===== -->
        <div id="zonePage" class="hidden">
            <div class="crime-header">
                <h1>👁️ СВИДЕТЕЛЬ</h1>
                <div class="sub" id="zoneSubtitle">ПОДСКАЗКИ</div>
            </div>
            <div class="group-header" id="zoneTitle">ЗОНА: ЗАГРУЗКА...</div>

            <div class="hint-display" id="hintDisplay">Нажмите «Показать подсказку»</div>

            <div class="hint-actions">
                <button class="hint-btn-action" id="showHintBtn">🔍 ПОКАЗАТЬ ПОДСКАЗКУ</button>
                <button class="hint-btn-action delete" id="deleteHintBtn" disabled>🗑️ УДАЛИТЬ ПОДСКАЗКУ</button>
            </div>

            <div style="color: #5f4e32; font-size: 0.7rem; margin: 10px 0;">
                <span id="hintCounter">Осталось подсказок: 0</span>
            </div>

            <button class="back-btn" id="backToZonesBtn">← НАЗАД К ЗОНАМ</button>
            <div class="footer">ПОДСКАЗКИ УДАЛЯЮТСЯ ПОСЛЕ ИСПОЛЬЗОВАНИЯ</div>
        </div>

    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО ===== -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalBox">
            <div class="modal-icon" id="modalIcon">⏳</div>
            <div class="modal-title" id="modalTitle">ЗАГРУЗКА...</div>
            <div class="modal-message" id="modalMessage">Пожалуйста, подождите</div>
            <button class="modal-btn" id="modalBtn">ПОНЯТНО</button>
        </div>
    </div>

    <script>
        // ===== НОВАЯ ССЫЛКА =====
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcuRHfIBrtA7R9oBz2wJz01elzSOn6zMnqIt2PlGmIVQckD67WkjAU5GCbFQey5c4itQ/exec';

        // ===== FULLSCREEN =====
        document.getElementById('fullscreenBtn').addEventListener('click', function() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(e => console.warn(e));
            } else {
                document.exitFullscreen();
            }
        });

        // ===== КНОПКА ДОМОЙ =====
        document.getElementById('homeButton').addEventListener('click', function() {
            showMainPage();
        });

        // ===== МОДАЛЬНОЕ ОКНО =====
        const modalOverlay = document.getElementById('modalOverlay');
        const modalBox = document.getElementById('modalBox');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const modalBtn = document.getElementById('modalBtn');

        function showModal(icon, title, message, isError = false, isLoader = false) {
            modalIcon.textContent = icon;
            modalTitle.textContent = title;
            modalMessage.textContent = message;
            
            if (isLoader) {
                modalBox.className = 'modal-box loading';
                modalBtn.style.display = 'none';
            } else {
                modalBox.className = 'modal-box ' + (isError ? 'error' : '');
                modalBtn.style.display = 'inline-block';
            }
            
            modalOverlay.className = 'modal-overlay active';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function hideModal() {
            modalOverlay.classList.remove('active');
        }

        modalBtn.addEventListener('click', hideModal);
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay && !modalBox.classList.contains('loading')) {
                hideModal();
            }
        });

        // ===== ПЕРЕКЛЮЧЕНИЕ СТРАНИЦ =====
        const mainPage = document.getElementById('mainPage');
        const zonePage = document.getElementById('zonePage');
        const backBtn = document.getElementById('backToZonesBtn');

        let currentZone = '';
        let hintsData = {};
        let currentHint = '';
        let currentHintList = [];

        // ===== ФУНКЦИЯ ПЕРЕМЕШИВАНИЯ МАССИВА =====
        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function showMainPage() {
            mainPage.classList.remove('hidden');
            zonePage.classList.add('hidden');
            window.location.hash = '';
        }

        function showZonePage(zoneName) {
            mainPage.classList.add('hidden');
            zonePage.classList.remove('hidden');
            currentZone = zoneName;
            window.location.hash = 'zone=' + encodeURIComponent(zoneName);
            document.getElementById('zoneTitle').textContent = `ЗОНА: ${zoneName}`;
            document.getElementById('hintDisplay').textContent = 'Загрузка подсказок...';
            document.getElementById('hintDisplay').className = 'hint-display';
            document.getElementById('showHintBtn').disabled = true;
            document.getElementById('deleteHintBtn').disabled = true;
            loadHints();
        }

        backBtn.addEventListener('click', showMainPage);

        // ===== ЗАГРУЗКА ПОДСКАЗОК =====
        async function loadHints() {
            showModal('⏳', 'ЗАГРУЗКА...', 'Загружаем подсказки', false, true);

            try {
                const response = await fetch(GOOGLE_SCRIPT_URL + '?action=getHints');
                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error);
                }
                
                hintsData = data;
                currentHintList = shuffleArray(data[currentZone] || []);
                updateHintDisplay();
                
                hideModal();
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                hideModal();
                showModal('❌', 'ОШИБКА', 'Не удалось загрузить подсказки. Проверьте интернет.', true);
                document.getElementById('hintDisplay').textContent = 'Ошибка загрузки';
                document.getElementById('hintDisplay').className = 'hint-display empty';
            }
        }

        // ===== ОБНОВЛЕНИЕ ОТОБРАЖЕНИЯ =====
        function updateHintDisplay() {
            const display = document.getElementById('hintDisplay');
            const counter = document.getElementById('hintCounter');
            const showBtn = document.getElementById('showHintBtn');
            const deleteBtn = document.getElementById('deleteHintBtn');

            counter.textContent = `Осталось подсказок: ${currentHintList.length}`;

            if (currentHintList.length === 0) {
                display.textContent = 'Подсказки закончились!';
                display.className = 'hint-display empty';
                showBtn.disabled = true;
                deleteBtn.disabled = true;
                currentHint = '';
                return;
            }

            if (currentHint) {
                display.textContent = currentHint;
                display.className = 'hint-display';
                showBtn.disabled = true;
                deleteBtn.disabled = false;
            } else {
                display.textContent = 'Нажмите «Показать подсказку»';
                display.className = 'hint-display empty';
                showBtn.disabled = false;
                deleteBtn.disabled = true;
            }
        }

        // ===== ПОКАЗАТЬ ПОДСКАЗКУ =====
        document.getElementById('showHintBtn').addEventListener('click', function() {
            if (currentHintList.length === 0) return;
            
            currentHint = currentHintList[0];
            currentHintList.shift();
            
            updateHintDisplay();
        });

        // ===== УДАЛИТЬ ПОДСКАЗКУ =====
        document.getElementById('deleteHintBtn').addEventListener('click', async function() {
            if (!currentHint || currentHintList.length === 0) return;

            if (!confirm(`Удалить подсказку?\n\n"${currentHint}"`)) return;

            this.disabled = true;
            showModal('⏳', 'УДАЛЕНИЕ...', 'Удаляем подсказку', false, true);

            try {
                const response = await fetch(
                    GOOGLE_SCRIPT_URL + 
                    `?action=deleteHint&zone=${encodeURIComponent(currentZone)}&hint=${encodeURIComponent(currentHint)}`
                );
                const result = await response.json();

                if (result.success) {
                    currentHint = '';
                    hideModal();
                    updateHintDisplay();
                    showModal('✅', 'ГОТОВО!', 'Подсказка удалена', false);
                } else {
                    throw new Error(result.error || 'Неизвестная ошибка');
                }
            } catch (error) {
                console.error('Ошибка удаления:', error);
                hideModal();
                showModal('❌', 'ОШИБКА', 'Не удалось удалить подсказку: ' + error.message, true);
                this.disabled = false;
                updateHintDisplay();
            }
        });

        // ===== СОЗДАНИЕ КНОПОК ЗОН =====
        const zones = [
            'ШО-1', 'ШО-2', 'ШО-4',
            'Пифагора', 'Архимеда', 'Декарта',
            'Ферма', 'Паскаля', 'Эйлера',
            'Cluedo'
        ];

        const grid = document.getElementById('zoneGrid');
        zones.forEach(zone => {
            const btn = document.createElement('div');
            btn.className = 'btn';
            btn.textContent = zone;
            btn.onclick = function() {
                showZonePage(zone);
            };
            grid.appendChild(btn);
        });

        // ===== ОБРАБОТКА ХЭША =====
        function handleHash() {
            const hash = window.location.hash;
            if (hash.startsWith('#zone=')) {
                const zoneName = decodeURIComponent(hash.replace('#zone=', ''));
                if (zones.includes(zoneName)) {
                    showZonePage(zoneName);
                } else {
                    showMainPage();
                }
            } else {
                showMainPage();
            }
        }

        window.addEventListener('hashchange', handleHash);

        // ===== ИНИЦИАЛИЗАЦИЯ =====
        handleHash();
    </script>
</body>
</html>
